# CI: формат, clippy, тесты всего workspace, сборка бинарников (хаб, редактор, примеры).
# GPU в раннере нет: рендер-тесты идут через Mesa llvmpipe на GL (тир Compat),
# так же, как это проверяется локально.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Новые уязвимости появляются без наших коммитов: supply-chain гоняется раз в неделю.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Безголовый GL: wgpu берёт EGL от Mesa (llvmpipe), а не от проприетарного драйвера.
  WGPU_BACKEND: gl
  __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
  LIBGL_ALWAYS_SOFTWARE: 1
  GALLIUM_DRIVER: llvmpipe

jobs:
  fmt:
    name: rustfmt
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: unwrap/expect вне тестов (tools/unwrap_allowance.toml)
        run: python3 tools/check_unwrap.py

  check:
    name: clippy, тесты, сборка
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Системные зависимости (winit, wgpu, egui, kira, gilrs, Mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libasound2-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libx11-xcb1 libxcb1 \
            libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 mesa-vulkan-drivers xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: тесты
        run: cargo test --workspace --locked --no-fail-fast

      - name: бинарник без путей сборки и имени пользователя (B3, tools/check_binary_strings.py)
        run: |
          keep="$RUNNER_TEMP/keep-bin"
          OLVIN_KEEP_TEST_BINARY="$keep" cargo test -p olvin_hub_cli --test build --locked release_hides
          python3 tools/check_binary_strings.py "$keep/remapped-game" --auto --forbid "$(cat "$keep/forbidden.txt")"
          # контроль: без ремапа та же проверка обязана найти утечку
          if python3 tools/check_binary_strings.py "$keep/leaky-game" --forbid "$(cat "$keep/forbidden.txt")"; then
            echo "проверка не увидела утечку в контрольном бинарнике"; exit 1
          fi

      - name: литерал obf! не лежит в релизном бинарнике (E1)
        run: cargo test -p olvin_core --test obf_binary --locked -- --ignored

      - name: подписанная сборка проверяет себя и отказывается от подменённых файлов (B2, E2)
        run: cargo test -p olvin_hub_cli --test signed_game --locked -- --ignored

      - name: смоук-тест окна (виртуальный дисплей)
        run: OLVIN_WINDOW_SMOKE=1 xvfb-run -a cargo test -p olvin_window --test window_smoke --locked

      - name: сборка бинарников (olvin-hub, olvin-hub-gui, olvin-editor-dev, примеры)
        run: cargo build --workspace --bins --locked

  supply-chain:
    name: cargo deny, cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      # Лицензии, запрещённые крейты, источники (deny.toml) и RustSec (уязвимости падают, unmaintained только предупреждение).
      - run: cargo deny --locked check
      - run: cargo audit
