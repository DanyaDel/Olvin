# Wiki: собирает две книги mdBook (docs/wiki/ru и docs/wiki/en), проверяет ссылки и
# справочник Lua, на push в main публикует на GitHub Pages.
# Публикация включается так: Settings → Pages → Source: GitHub Actions, затем
# Settings → Secrets and variables → Actions → Variables → WIKI_PAGES = true.
# Пока переменной нет, workflow только собирает и проверяет книги.
name: Wiki

on:
  push:
    branches: [main, master]
    paths:
      - "docs/wiki/**"
      - "crates/olvin_script/src/lua/**"
      - ".github/workflows/wiki.yml"
  pull_request:
    paths:
      - "docs/wiki/**"
      - "crates/olvin_script/src/lua/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка ссылок, якорей и парности ru/en
        run: python3 docs/wiki/tools/check_links.py

      - name: Справочник Lua сверяется с кодом
        run: python3 docs/wiki/tools/check_lua_reference.py

      - name: mdBook
        run: |
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          sudo mv mdbook /usr/local/bin/mdbook
          mdbook --version

      - name: Сборка книг
        run: |
          mdbook build docs/wiki/ru 2> build-ru.log
          mdbook build docs/wiki/en 2> build-en.log
          cat build-ru.log build-en.log
          if grep -qiE "warn|error" build-ru.log build-en.log; then echo "mdBook дал предупреждения"; exit 1; fi
          printf '<!doctype html><meta charset="utf-8"><title>Olvin Wiki</title><meta http-equiv="refresh" content="0; url=ru/"><p><a href="ru/">Русская версия</a> · <a href="en/">English version</a></p>\n' > book/index.html

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && vars.WIKI_PAGES == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.WIKI_PAGES == 'true'
        with:
          path: book

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && vars.WIKI_PAGES == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
