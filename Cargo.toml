[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "hub/*", "editor/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DanyaDel/Olvin"

[workspace.dependencies]
olvin_core = { path = "crates/olvin_core" }
olvin_ecs = { path = "crates/olvin_ecs" }
olvin_scene = { path = "crates/olvin_scene" }
olvin_window = { path = "crates/olvin_window" }
olvin_net = { path = "crates/olvin_net" }
olvin_render = { path = "crates/olvin_render" }
olvin_csg = { path = "crates/olvin_csg" }
olvin_physics = { path = "crates/olvin_physics" }
olvin_transform = { path = "crates/olvin_transform" }
olvin_anim = { path = "crates/olvin_anim" }
olvin_mesh = { path = "crates/olvin_mesh" }
olvin_text = { path = "crates/olvin_text" }
olvin_gui = { path = "crates/olvin_gui" }
olvin = { path = "crates/olvin" }
# Shared UI kit (themes, fonts, logo, motion) for the editor and the hub.
olvin_ui = { path = "crates/olvin_ui" }
# The list of projects the hub and the editor may build and run (T1).
olvin_trust = { path = "crates/olvin_trust" }

glam = { version = "0.34", features = ["bytemuck", "serde"] }
hecs = "0.11"
wgpu = "30"
winit = "0.30"
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
log = "0.4"

# Hub (olvin-hub): project and module manager, separate from the engine.
olvin_hub = { path = "hub/olvin_hub" }
toml_edit = "0.25"
toml = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
dirs = "7"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
egui = "0.36"
ron = "0.12"

# Editor (olvin-editor): installed separately, extended by plugin crates.
olvin_editor = { path = "editor/olvin_editor" }
egui_dock = { version = "0.21", features = ["serde"] }

# Dependencies are always optimized: math/ECS/wgpu in debug are painfully slow,
# while our own crates stay quick to compile.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
