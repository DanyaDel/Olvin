[package]
name = "editor_dev"
description = "Development build of olvin-editor with every element linked in"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "olvin-editor-dev"
path = "src/main.rs"

[dependencies]
olvin_editor.workspace = true
olvin_editor_console = { path = "../../editor/olvin_editor_console" }
olvin_editor_animator = { path = "../../editor/olvin_editor_animator" }
olvin_editor_csg = { path = "../../editor/olvin_editor_csg" }
olvin_editor_modeling = { path = "../../editor/olvin_editor_modeling" }
olvin_editor_uv = { path = "../../editor/olvin_editor_uv" }
olvin_editor_profiler = { path = "../../editor/olvin_editor_profiler" }
olvin_editor_ide = { path = "../../editor/olvin_editor_ide" }

[dev-dependencies]
eframe.workspace = true
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
