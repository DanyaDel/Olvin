[package]
name = "olvin"
description = "Olvin: modular game engine. Facade crate, every subsystem is an optional feature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["window", "render"]
window = ["dep:olvin_window"]
render = ["dep:olvin_render"]
# Load .scene.ron files saved by olvin-editor.
scene = ["render", "olvin_scene/serde", "dep:olvin_csg"]
# Colliders and rigidbodies simulated with Rapier.
physics = ["dep:olvin_physics"]

[dependencies]
olvin_core.workspace = true
olvin_ecs.workspace = true
olvin_scene.workspace = true
olvin_transform.workspace = true
olvin_window = { workspace = true, optional = true }
olvin_render = { workspace = true, optional = true }
olvin_csg = { workspace = true, optional = true }
olvin_physics = { workspace = true, optional = true }
glam.workspace = true
log.workspace = true
