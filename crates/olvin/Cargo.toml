[package]
name = "olvin"
description = "Olvin: modular game engine. Facade crate, every subsystem is an optional feature"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["window", "render"]
window = ["dep:olvin_window"]
render = ["dep:olvin_render", "olvin_gui?/render", "olvin_script?/morph"]
# Load .scene.ron files saved by olvin-editor (with their glTF models and animators).
scene = ["render", "anim", "assets", "olvin_scene/serde", "dep:olvin_csg", "dep:serde", "dep:ron"]
# Skeletal animation without the renderer: Animator, AnimGraph, AnimPlugin.
anim = ["dep:olvin_anim"]
# Asset pipeline: .meta GUIDs, images, glTF import, AssetManager.
assets = ["dep:olvin_assets"]
# Colliders and rigidbodies simulated with Rapier.
physics = ["dep:olvin_physics", "olvin_script?/physics", "olvin_game?/physics", "olvin_net?/physics"]
# Unity-style behaviours in Rust (Scripts from scenes → instances).
script = ["dep:olvin_script", "olvin_game?/script"]
# Lua 5.4 behaviours with hot reload (`olvin::script::lua`, vendored Lua, no system library).
lua = ["script", "olvin_script/lua"]
# Action maps over keyboard, mouse and gamepads (gilrs).
input = ["dep:olvin_input", "olvin_script?/input"]
# Sound on kira: AudioSource / AudioListener, one-shots, streamed music.
audio = ["dep:olvin_audio", "olvin_script?/audio", "olvin_cutscene?/audio"]
# Game states, background scene loading, save slots.
game = ["dep:olvin_game"]
# In-game UI (`olvin::gui`): buttons, labels, layout, gamepad focus; with `render`
# it is drawn over the frame with real text (`olvin::text`, built-in Inter).
gui = ["input", "dep:olvin_gui", "dep:olvin_text"]

# String tables with a fallback language, placeholders and plurals (`olvin::locale`).
locale = ["dep:olvin_locale"]

# Navigation (`olvin::nav`): bake walkable ground from colliders, A* paths, `NavAgent`.
nav = ["dep:olvin_nav", "olvin_nav/engine", "olvin_script?/nav"]

# Cutscenes (`olvin::cutscene`): a timeline of object moves, camera cuts, sounds and script messages.
cutscene = ["dep:olvin_cutscene", "script"]
# Heightmap terrains (`olvin::terrain`): spawned from scenes with chunks, layers and a collider.
terrain = ["dep:olvin_terrain", "scene"]

# Signed manifest of the shipped files and `olvin::core::integrity::IntegrityPlugin` (olvin-hub build --release).
integrity = ["olvin_core/integrity"]
# Netcode (`olvin::net`): transports, sessions, replication, messages, prediction.
net = ["dep:olvin_net", "olvin_script?/net"]
# QUIC sockets for `net` (TLS 1.3, pinned certificates): hosting, joining by room code.
net-quic = ["net", "olvin_net/quic"]

# Profiler scopes (puffin) over systems, render passes, physics and scripts; set OLVIN_PROFILE=1
# or call `olvin::core::profile::set_enabled`. Off: the scopes compile to nothing.
profile = ["olvin_core/profile"]
# Also serve the profile for puffin_viewer (OLVIN_PROFILE_HTTP=1, port 8585).
profile-http = ["olvin_core/profile-http"]

[dependencies]
olvin_locale = { workspace = true, optional = true }
olvin_nav = { workspace = true, optional = true }
olvin_cutscene = { workspace = true, optional = true }
olvin_terrain = { workspace = true, optional = true }
olvin_core.workspace = true
olvin_ecs.workspace = true
olvin_scene.workspace = true
olvin_transform.workspace = true
olvin_window = { workspace = true, optional = true }
olvin_render = { workspace = true, optional = true }
olvin_csg = { workspace = true, optional = true }
olvin_assets = { path = "../olvin_assets", optional = true }
olvin_anim = { workspace = true, optional = true }
olvin_physics = { workspace = true, optional = true }
olvin_script = { path = "../olvin_script", optional = true, default-features = false }
olvin_input = { path = "../olvin_input", optional = true }
olvin_audio = { path = "../olvin_audio", optional = true }
olvin_game = { path = "../olvin_game", optional = true }
olvin_net = { workspace = true, optional = true }
olvin_gui = { workspace = true, optional = true }
olvin_text = { workspace = true, optional = true }
glam.workspace = true
log.workspace = true
serde = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
