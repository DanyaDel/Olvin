[package]
name = "olvin_core"
description = "Olvin core: App, plugins, resources, schedule, time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Profiler scopes (puffin) around systems and engine passes. Off: the scope macros expand to nothing.
profile = ["dep:puffin"]
# Serve the profile over TCP for puffin_viewer (OLVIN_PROFILE_HTTP=1).
profile-http = ["profile", "dep:puffin_http"]

[dependencies]
puffin = { version = "0.20", optional = true }
puffin_http = { version = "0.17", optional = true }
raw-window-handle.workspace = true
log.workspace = true
# E3: secrets are wiped on drop; E1: string literals scrambled in the binary.
zeroize = "1"
obfstr = "0.4"
