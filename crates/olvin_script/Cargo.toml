[package]
name = "olvin_script"
description = "Olvin scripting: Unity-style behaviours written in Rust, attached by name from scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["input", "physics"]
# ScriptCtx::input() (ActionState) and the input-driven built-ins.
input = ["dep:olvin_input"]
# fixed_update with physics steps, collision/trigger callbacks, raycasts, character motor.
physics = ["dep:olvin_physics"]
# Behaviours written in Lua 5.4 (mlua, vendored: no system Lua needed), with hot reload.
lua = ["dep:mlua"]
# Lua `ctx:play_sound*` / `ctx:play_source` through olvin_audio's `Audio` resource.
audio = ["dep:olvin_audio"]
# `ctx:net_send`, `on_net_message`, replicated variables through olvin_net (see lua/net.rs).
net = ["dep:olvin_net"]

[dependencies]
olvin_core = { path = "../olvin_core" }
olvin_ecs = { path = "../olvin_ecs" }
olvin_scene = { path = "../olvin_scene", features = ["serde"] }
olvin_transform = { path = "../olvin_transform" }
olvin_input = { path = "../olvin_input", optional = true, default-features = false }
olvin_physics = { path = "../olvin_physics", optional = true }
olvin_audio = { path = "../olvin_audio", optional = true }
olvin_net = { path = "../olvin_net", optional = true }
# Ref/RefMut/DynamicBundle are not re-exported by olvin_ecs yet.
hecs.workspace = true
glam.workspace = true
log.workspace = true
serde.workspace = true
ron.workspace = true
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }

# 5 000 `update` calls per frame, Lua vs Rust behaviours (std::time, no criterion):
# cargo bench -p olvin_script --features lua --bench lua_vs_rust
[[bench]]
name = "lua_vs_rust"
harness = false
required-features = ["lua", "input"]
