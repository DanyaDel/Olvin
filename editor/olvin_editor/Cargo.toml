[package]
name = "olvin_editor"
description = "Olvin editor: dockable workspaces, scene hierarchy, inspector, assets, viewport; extended by plugin crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "olvin-editor"
path = "src/main.rs"

[dependencies]
olvin_scene = { workspace = true, features = ["serde"] }
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
bytemuck.workspace = true
glam.workspace = true
serde.workspace = true
ron.workspace = true
dirs.workspace = true
