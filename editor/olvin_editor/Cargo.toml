[package]
name = "olvin_editor"
description = "Olvin editor: dockable workspaces, scene hierarchy, inspector, assets, viewport; extended by plugin crates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "olvin-editor"
path = "src/main.rs"

[dependencies]
olvin_scene = { workspace = true, features = ["serde"] }
olvin_assets = { path = "../../crates/olvin_assets" }
olvin = { workspace = true, default-features = false, features = ["render", "scene", "physics", "window", "script", "lua", "input"] }
olvin_ui.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
bytemuck.workspace = true
glam.workspace = true
serde.workspace = true
ron.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
