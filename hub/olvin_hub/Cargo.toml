[package]
name = "olvin_hub"
description = "olvin-hub core: module catalog, game projects, Cargo.toml editing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
toml_edit.workspace = true
toml.workspace = true
serde.workspace = true
anyhow.workspace = true
dirs.workspace = true
olvin_library = { path = "../../crates/olvin_library" }
serde_json = "1"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
olvin_core = { workspace = true, features = ["integrity"] }
# Key generation: 32 random bytes from the OS.
getrandom = "0.3"
zeroize = "1"
olvin_trust.workspace = true
