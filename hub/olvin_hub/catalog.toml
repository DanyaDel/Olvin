# Каталог модулей olvin-hub.
#   kind = "olvin": фича фасадного крейта `olvin`, плагин подключается через DefaultPlugins.
#   kind = "crate": обычная зависимость с crates.io, подключается как библиотека.
# requires: какие модули ставятся вместе с этим.

[[module]]
id = "window"
name = "Окно и ввод"
category = "Olvin"
description = "winit: окно, клавиатура, мышь, главный цикл"
kind = "olvin"
feature = "window"
default = true

[[module]]
id = "render"
name = "3D-рендер"
category = "Olvin"
description = "wgpu: instancing, отсечение по камере; Vulkan / Metal / DX12 / GL / WebGL2"
kind = "olvin"
feature = "render"
requires = ["window"]
default = true

[[module]]
id = "scenes"
name = "Сцены из редактора"
category = "Olvin"
description = "Загрузка .scene.ron из olvin-editor: материалы, текстуры, небо, шейдеры, glTF"
kind = "olvin"
feature = "scene"
requires = ["render"]
default = true

[[module]]
id = "physics"
name = "Физика 3D"
category = "Геймплей"
description = "Rapier: коллайдеры и Rigidbody из редактора работают в игре, у CSG-уровня статический коллайдер"
kind = "olvin"
feature = "physics"

[[module]]
id = "scripts"
name = "Скрипты (Behaviour)"
category = "Геймплей"
description = "Поведения на Rust как в Unity: start/update/fixed_update, коллизии и триггеры, параметры из редактора, готовые Rotator, FollowTarget, контроллер игрока"
kind = "olvin"
feature = "script"
default = true

[[module]]
id = "input"
name = "Ввод (действия)"
category = "Геймплей"
description = "Карты действий: клавиатура, мышь, геймпады (gilrs), WASD-композиты, assets/input.ron"
kind = "olvin"
feature = "input"
requires = ["window"]
default = true

[[module]]
id = "audio"
name = "Звук"
category = "Геймплей"
description = "Kira: Audio Source / Listener из редактора, 3D-затухание, музыка потоком"
kind = "olvin"
feature = "audio"

[[module]]
id = "gltf"
name = "Загрузка glTF"
category = "Ассеты"
description = "Чтение моделей .gltf / .glb"
kind = "crate"
crate = "gltf"
version = "1.4"

[[module]]
id = "rand"
name = "Случайные числа"
category = "Утилиты"
description = "rand: генераторы, распределения, перемешивание"
kind = "crate"
crate = "rand"
version = "0.10"

[[module]]
id = "serde"
name = "Сериализация"
category = "Утилиты"
description = "serde с derive: основа для сохранений и конфигов"
kind = "crate"
crate = "serde"
version = "1"
features = ["derive"]

[[module]]
id = "saves"
name = "Сохранения (RON)"
category = "Утилиты"
description = "ron: читаемый формат для сохранений и настроек"
kind = "crate"
crate = "ron"
version = "0.12"
requires = ["serde"]

# --- Элементы редактора -------------------------------------------------
# Ставятся в установку olvin-editor (olvin-hub editor add <id>).
# База редактора (сцена, иерархия, инспектор, ассеты) есть всегда.

[[editor_module]]
id = "console"
name = "Консоль"
description = "Лог редактора: сохранения, ошибки, сообщения элементов"
crate = "olvin_editor_console"
path = "editor/olvin_editor_console"
plugin = "olvin_editor_console::ConsolePlugin"
default = true

[[editor_module]]
id = "animator"
name = "Аниматор"
description = "Таймлайн с ключами Transform, превью во вьюпорте, рабочая область «Анимация»"
crate = "olvin_editor_animator"
path = "editor/olvin_editor_animator"
plugin = "olvin_editor_animator::AnimatorPlugin"

[[editor_module]]
id = "csg"
name = "CSG (маппинг уровней)"
description = "Браши с булевыми операциями, рисование по поверхности, ручки граней, адаптивная сетка; форма брашей правится в Edit Mode элемента «Моделирование»"
crate = "olvin_editor_csg"
path = "editor/olvin_editor_csg"
plugin = "olvin_editor_csg::CsgPlugin"
default = true

[[editor_module]]
id = "modeling"
name = "Моделирование (Edit Mode)"
description = "Редактирование мешей как в Blender: вершины/рёбра/грани, extrude, inset, loop cut, нож, заполнение, слияние, сглаживание"
crate = "olvin_editor_modeling"
path = "editor/olvin_editor_modeling"
plugin = "olvin_editor_modeling::ModelingPlugin"
default = true

[[editor_module]]
id = "ide"
name = "IDE (код и шейдеры)"
description = "Редактор кода в движке: дерево проекта, подсветка Rust/WGSL/RON/TOML/Markdown, поиск и замена, cargo check/build/run с панелями Problems и Output, проверка surface-шейдеров через naga, палитра команд"
crate = "olvin_editor_ide"
path = "editor/olvin_editor_ide"
plugin = "olvin_editor_ide::IdePlugin"
default = false

[[editor_module]]
id = "uv"
name = "UV-редактор"
description = "Развёртка как в Blender: LSCM-unwrap по швам, проекции (box/planar/cylinder/sphere), упаковка островов, G/R/S в UV, рабочая область «UV Editing»"
crate = "olvin_editor_uv"
path = "editor/olvin_editor_uv"
plugin = "olvin_editor_uv::UvPlugin"
default = true
