# olvin-hub module catalog.
#   kind = "olvin": a feature of the `olvin` facade crate; its plugin comes in through DefaultPlugins.
#   kind = "crate": a plain crates.io dependency, used as a library.
# requires: modules installed together with this one.

[[module]]
id = "window"
name = "Window"
category = "Olvin"
description = "winit: the window, keyboard, mouse and main loop"
kind = "olvin"
feature = "window"
default = true

[[module]]
id = "render"
name = "3D rendering"
category = "Olvin"
description = "wgpu: instancing, frustum culling; Vulkan / Metal / DX12 / GL / WebGL2"
kind = "olvin"
feature = "render"
requires = ["window"]
default = true

[[module]]
id = "scenes"
name = "Editor scenes"
category = "Olvin"
description = "Loads .scene.ron from olvin-editor: materials, textures, sky, shaders, glTF"
kind = "olvin"
feature = "scene"
requires = ["render"]
default = true

[[module]]
id = "physics"
name = "3D physics"
category = "Gameplay"
description = "Rapier: colliders and rigidbodies from the editor work in the game; the CSG level gets a static collider"
kind = "olvin"
feature = "physics"

[[module]]
id = "scripts"
name = "Scripts"
category = "Gameplay"
description = "Unity-style behaviours in Rust: start/update/fixed_update, collisions and triggers, parameters from the editor, built-in Rotator, FollowTarget and a player controller"
kind = "olvin"
feature = "script"
default = true

[[module]]
id = "input"
name = "Input actions"
category = "Gameplay"
description = "Action maps: keyboard, mouse, gamepads (gilrs), WASD composites, assets/input.ron"
kind = "olvin"
feature = "input"
requires = ["window"]
default = true

[[module]]
id = "audio"
name = "Audio"
category = "Gameplay"
description = "Kira: Audio Source / Listener from the editor, 3D falloff, streamed music"
kind = "olvin"
feature = "audio"

[[module]]
id = "lua"
name = "Lua scripts"
category = "Gameplay"
description = "Lua 5.4 behaviours next to the Rust ones: assets/scripts/*.lua, hot reload, sandbox and limits; Lua is built in, no system library"
kind = "olvin"
feature = "lua"
requires = ["scripts"]

[[module]]
id = "game"
name = "Game runtime"
category = "Gameplay"
description = "Game states with enter/exit hooks, scene loading in the background, save slots"
kind = "olvin"
feature = "game"

[[module]]
id = "gltf"
name = "glTF loading"
category = "Assets"
description = "Reads .gltf / .glb models"
kind = "crate"
crate = "gltf"
version = "1.4"

[[module]]
id = "rand"
name = "Random numbers"
category = "Utilities"
description = "rand: generators, distributions, shuffling"
kind = "crate"
crate = "rand"
version = "0.10"

[[module]]
id = "serde"
name = "Serialization"
category = "Utilities"
description = "serde with derive: the base for saves and configs"
kind = "crate"
crate = "serde"
version = "1"
features = ["derive"]

[[module]]
id = "saves"
name = "Saves (RON)"
category = "Utilities"
description = "ron: a readable format for saves and settings"
kind = "crate"
crate = "ron"
version = "0.12"
requires = ["serde"]

# --- Editor elements ------------------------------------------------------
# Installed into the olvin-editor build (olvin-hub editor add <id>).
# The editor core (scene, hierarchy, inspector, assets) is always there.

[[editor_module]]
id = "console"
name = "Console"
description = "The editor log: saves, errors, messages from elements"
crate = "olvin_editor_console"
path = "editor/olvin_editor_console"
plugin = "olvin_editor_console::ConsolePlugin"
default = true

[[editor_module]]
id = "animator"
name = "Animator"
description = "A timeline with Transform keys, viewport preview and the Animation workspace"
crate = "olvin_editor_animator"
path = "editor/olvin_editor_animator"
plugin = "olvin_editor_animator::AnimatorPlugin"

[[editor_module]]
id = "csg"
name = "CSG level mapping"
description = "Brushes with boolean operations, drawing on surfaces, face handles, an adaptive grid; brush shapes are edited in the Modeling Edit Mode"
crate = "olvin_editor_csg"
path = "editor/olvin_editor_csg"
plugin = "olvin_editor_csg::CsgPlugin"
default = true

[[editor_module]]
id = "modeling"
name = "Modeling"
description = "Blender-style mesh editing: vertices, edges and faces, extrude, inset, loop cut, knife, fill, merge, subdivide"
crate = "olvin_editor_modeling"
path = "editor/olvin_editor_modeling"
plugin = "olvin_editor_modeling::ModelingPlugin"
default = true

[[editor_module]]
id = "ide"
name = "IDE"
description = "Code and shaders inside the editor: project tree, Rust/WGSL/RON/TOML/Markdown highlighting, find and replace, cargo check/build/run with Problems and Output, naga checks for surface shaders, a command palette"
crate = "olvin_editor_ide"
path = "editor/olvin_editor_ide"
plugin = "olvin_editor_ide::IdePlugin"
default = false

[[editor_module]]
id = "uv"
name = "UV Editor"
description = "Blender-style unwrapping: LSCM along seams, box/planar/cylinder/sphere projections, island packing, G/R/S in UV, the UV Editing workspace"
crate = "olvin_editor_uv"
path = "editor/olvin_editor_uv"
plugin = "olvin_editor_uv::UvPlugin"
default = true
